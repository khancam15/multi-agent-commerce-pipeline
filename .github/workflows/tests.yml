name: Tests

on:
  pull_request:
  # Docs-only pushes to main don't need the test suite. Pull requests always
  # run it, so a required check never waits on a skipped run.
  push:
    branches:
      - main
      - master
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q scripts tests

      - name: Lint (pyflakes rules)
        run: ruff check --select F scripts tests

      - name: Shell syntax
        run: for f in run.sh loop.sh setup_vps.sh test_infrastructure.sh; do bash -n "$f"; done

      - name: Run tests
        run: pytest -q
